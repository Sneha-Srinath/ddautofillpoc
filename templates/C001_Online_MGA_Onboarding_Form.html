<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Online MGA Onboarding Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--brand:#1B365D;--accent:#C9A23F}
*{box-sizing:border-box} body{margin:0;background:#EEF1F5;font-family:'Segoe UI',Arial,sans-serif;color:#1C2533}
.page{max-width:760px;margin:24px auto;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 10px rgba(20,35,60,.08)}
header{background:var(--brand);color:#fff;padding:22px 28px;border-bottom:4px solid var(--accent)}
header small{letter-spacing:.06em;font-weight:600;opacity:.85} header h1{margin:6px 0 0;font-size:24px}
.intro{padding:14px 28px 0;color:#5B6676;font-size:13px}
form{padding:8px 28px 28px} fieldset{border:1px solid #D5DBE3;border-radius:8px;margin:16px 0 0;padding:12px 16px 14px}
legend{font-weight:700;color:var(--brand);padding:0 6px;font-size:14px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5B6676;font-weight:600}
.f.wide{grid-column:1 / -1}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{
  font:inherit;font-size:14px;font-weight:400;color:#1C2533;padding:8px 10px;border:1px solid #C9D1DC;border-radius:6px;background:#F8FAFC}
textarea{min-height:64px}
.opts{display:flex;gap:18px;flex-wrap:wrap;font-weight:400;color:#1C2533;font-size:14px}
.check{display:flex;align-items:center;gap:8px;font-weight:400;color:#1C2533;font-size:14px}
footer{padding:12px 28px;font-size:11px;color:#5B6676;border-top:1px solid #E3E7ED}
button{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:16px}
</style></head>
<body><div class="page">
<header><small>GRANITE SHIELD CASUALTY CO.</small><h1>Online MGA Onboarding Form</h1></header>
<p class="intro">Complete this form to onboard as a managing general agent. Fields marked * are required.</p>
<form><fieldset><legend>Company</legend><div class="row"><div class="f"><label for="f_legal_entity_name">Legal Entity Name *</label><input type="text" id="f_legal_entity_name" name="legal_entity_name"></div><div class="f"><label for="f_fein">FEIN *</label><input type="text" id="f_fein" name="fein" maxlength="10"></div><div class="f"><label for="f_dba">Doing Business As</label><input type="text" id="f_dba" name="dba"></div><div class="f"><label for="f_established">Date Established</label><input type="date" id="f_established" name="established"></div><div class="f"><label for="f_domicile">State of Domicile</label><select id="f_domicile" name="domicile"><option value=""></option><option>AL</option><option>DE</option><option>FL</option><option>GA</option><option>LA</option><option>MA</option><option>MS</option><option>NC</option><option>NY</option><option>PA</option><option>SC</option><option>TN</option><option>TX</option><option>VA</option></select></div><div class="f"><label for="f_entity_type">Entity Type</label><select id="f_entity_type" name="entity_type"><option value=""></option><option>Limited Liability Company</option><option>Corporation</option><option>Partnership</option><option>Mutual Company</option><option>Reciprocal Exchange</option></select></div><div class="f"><label for="f_website">Website</label><input type="text" id="f_website" name="website"></div></div></fieldset><fieldset><legend>Mailing address</legend><div class="row"><div class="f"><label for="f_street">Mailing Street</label><input type="text" id="f_street" name="street"></div><div class="f"><label for="f_city">Mailing City</label><input type="text" id="f_city" name="city"></div><div class="f"><label for="f_state">Mailing State</label><select id="f_state" name="state"><option value=""></option><option>AL</option><option>DE</option><option>FL</option><option>GA</option><option>LA</option><option>MA</option><option>MS</option><option>NC</option><option>NY</option><option>PA</option><option>SC</option><option>TN</option><option>TX</option><option>VA</option></select></div><div class="f"><label for="f_zip">Mailing ZIP</label><input type="text" id="f_zip" name="zip" maxlength="10"></div></div></fieldset><fieldset><legend>Primary contact</legend><div class="row"><div class="f"><label for="f_contact_name">Primary Contact Name</label><input type="text" id="f_contact_name" name="contact_name"></div><div class="f"><label for="f_contact_title">Primary Contact Title</label><input type="text" id="f_contact_title" name="contact_title"></div><div class="f"><label for="f_contact_phone">Telephone</label><input type="tel" id="f_contact_phone" name="contact_phone"></div><div class="f"><label for="f_contact_email">Email Address</label><input type="email" id="f_contact_email" name="contact_email"></div></div></fieldset><fieldset><legend>Program</legend><div class="row"><div class="f wide"><label for="f_gwp">Gross Written Premium (last fiscal year)</label><input type="text" id="f_gwp" name="gwp"></div><div class="f"><label for="f_programs">Number of Active Programs</label><input type="number" id="f_programs" name="programs"></div><div class="f"><label for="f_loss_ratio">Three Year Loss Ratio</label><input type="text" id="f_loss_ratio" name="loss_ratio"></div><div class="f wide"><label for="f_lines">Lines of Business Written</label><textarea id="f_lines" name="lines"></textarea></div><fieldset class="f wide"><legend>Binding Authority</legend><div class="opts"><label><input type="radio" name="binding_authority" value="Full"> Full</label><label><input type="radio" name="binding_authority" value="Limited"> Limited</label><label><input type="radio" name="binding_authority" value="Referral Only"> Referral Only</label></div></fieldset><div class="f wide"><label class="check"><input type="checkbox" id="f_uses_tpa" name="uses_tpa"> Uses a Third Party Administrator (TPA)</label></div><div class="f wide"><label class="check"><input type="checkbox" id="f_regulatory_action" name="regulatory_action"> Regulatory Action in Last 5 Years</label></div><div class="f wide"><label class="check"><input type="checkbox" id="f_cyber" name="cyber"> Cyber Coverage in Force</label></div></div></fieldset><fieldset><legend>Attestation</legend><div class="row"><div class="f"><label for="f_signature">Authorized Signature</label><input type="text" id="f_signature" name="signature"></div></div></fieldset><button type="submit">Submit</button></form>
<footer>Fictional demo form. All names and identifiers are mock data.</footer>
</div></body></html>
