# US commercial insurance due diligence glossary.
# Each concept lists the phrases (normalized: lower case, words only) that mean the same thing,
# whether they appear as a PDF field name/label or as a JSON path / DB column.
# `format` drives value conversion when the PDF field is a plain text field.
# `manual: true` concepts are never auto-filled (signatures, attestations).

